# kind cluster configuration for Radius.Compute/containerImages
#
# This config mounts the example app source directory into the kind node
# so that the containerImages recipe can access it via hostPath.
#
# Usage:
#   kind create cluster --name radius-demo --config kind-config.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraMounts:
      - hostPath: ./app          # path relative to where you run `kind create cluster`
        containerPath: /app/demo # path visible inside the kind node
