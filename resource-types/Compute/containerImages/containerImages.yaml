namespace: Radius.Compute
types:
  containerImages:
    description: |
      The Radius.Compute/containerImages Resource Type builds a container image from source and pushes it to a container registry. It is always part of a Radius Application.

      The build context is a local directory path on the host machine. The Kubernetes cluster must have the source directory available on the node, for example via kind `extraMounts`. The image is pushed to a remote container registry such as GitHub Container Registry (ghcr.io).

      To build and push a container image, add a containerImages resource to your application definition Bicep file:

        extension radius
        extension radiusResources

        param environment string

        resource myApp 'Radius.Core/applications@2025-08-01-preview' = {
          name: 'myApp'
          properties: {
            environment: environment
          }
        }

        resource myImage 'Radius.Compute/containerImages@2025-08-01-preview' = {
          name: 'myImage'
          properties: {
            environment: environment
            application: myApp.id
            image: 'ghcr.io/myorg/myapp:latest'
            build: {
              context: '/app/src/myapp'
            }
            registry: {
              secretName: 'ghcr-credentials'
            }
          }
        }

      To reference the built image in a Container resource:

        resource myContainer 'Radius.Compute/containers@2025-08-01-preview' = {
          name: 'myContainer'
          properties: {
            environment: environment
            application: myApp.id
            containers: {
              app: {
                image: myImage.properties.image
                ports: {
                  web: {
                    containerPort: 3000
                  }
                }
              }
            }
          }
        }

      Prerequisites:

      1. The kind cluster must be created with extraMounts mapping the host source directory into the node.

      2. A Kubernetes Secret of type `kubernetes.io/dockerconfigjson` must exist with registry credentials:

        kubectl create secret docker-registry ghcr-credentials --docker-server=ghcr.io --docker-username=USERNAME --docker-password=GITHUB_PAT

    apiVersions:
      '2025-08-01-preview':
        schema:
          type: object
          properties:
            environment:
              type: string
              description: (Required) The Radius Environment ID. Typically set by the rad CLI. Typically value should be `environment`.
            application:
              type: string
              description: (Required) The Radius Application ID. `myApplication.id` for example.
            image:
              type: string
              description: (Required) The full container image reference including registry, repository, and tag. `ghcr.io/myorg/myapp:latest` for example.
            build:
              type: object
              description: (Required) Build configuration for the container image.
              properties:
                context:
                  type: string
                  description: (Required) The path to the build context directory on the host. This must be a path available on the Kubernetes node, for example via kind extraMounts. `/app/src/myapp` for example.
                dockerfile:
                  type: string
                  description: (Optional) The path to the Dockerfile relative to the build context. If not specified, `Dockerfile` is assumed.
              required:
                - context
            registry:
              type: object
              description: (Optional) Registry authentication overrides. If not specified, the recipe uses credentials configured by the platform engineer via environment variables on the Radius control plane.
              properties:
                server:
                  type: string
                  description: (Optional) The registry server address. If not specified, `ghcr.io` is assumed.
                username:
                  type: string
                  description: (Optional) The registry username.
                token:
                  type: string
                  description: (Optional) The registry token or PAT.
                  x-radius-sensitive: true
          required:
            - environment
            - application
            - image
            - build
