name: E2E Test

on:
  push:
    branches: [main, docker-provider]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  CLUSTER_NAME: radius-e2e
  IMAGE_TAG: ${{ github.sha }}
  # Local dynamic-rp image, built from the radius/ submodule and
  # loaded into the kind cluster so the chart can pull it without
  # going through a registry.
  DYNAMIC_RP_REGISTRY: localhost
  DYNAMIC_RP_TAG: e2e

jobs:
  e2e:
    runs-on: ubuntu-latest
    # Only run on trusted events (GITHUB_TOKEN needs packages:write for GHCR push)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Derive registry path
        id: registry
        run: |
          # GHCR requires lowercase. Use repo name to auto-link package to this repo.
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "path=ghcr.io/${REPO}" >> "$GITHUB_OUTPUT"

      # ── Cluster setup ────────────────────────────────────────────

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: radius/go.mod
          cache-dependency-path: radius/go.sum

      - name: Install kind
        uses: helm/kind-action@v1
        with:
          install_only: true

      - name: Create kind cluster
        run: |
          # kind supports the UserNamespacesSupport feature gate, which
          # lets us run BuildKit rootless in PSA `restricted` mode
          # (the design's primary target). k3d/k3s does not currently
          # surface this feature gate (see k3d-io/k3d#1178 and #1439).
          cat > /tmp/kind-config.yaml <<'EOF'
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          name: radius-e2e
          featureGates:
            UserNamespacesSupport: true
          nodes:
            - role: control-plane
              kubeadmConfigPatches:
                - |
                  kind: ClusterConfiguration
                  apiServer:
                    extraArgs:
                      feature-gates: "UserNamespacesSupport=true"
                  controllerManager:
                    extraArgs:
                      feature-gates: "UserNamespacesSupport=true"
                  scheduler:
                    extraArgs:
                      feature-gates: "UserNamespacesSupport=true"
                - |
                  kind: InitConfiguration
                  nodeRegistration:
                    kubeletExtraArgs:
                      feature-gates: "UserNamespacesSupport=true"
          EOF
          kind create cluster --name $CLUSTER_NAME --config /tmp/kind-config.yaml --wait 120s

      - name: Build dynamic-rp image from the radius/ submodule
        working-directory: radius
        run: |
          # Builds linux/amd64 image tagged $DYNAMIC_RP_REGISTRY/dynamic-rp:$DYNAMIC_RP_TAG
          make docker-build-dynamic-rp \
            DOCKER_REGISTRY=$DYNAMIC_RP_REGISTRY \
            DOCKER_TAG_VERSION=$DYNAMIC_RP_TAG

      - name: Import dynamic-rp image into kind
        run: |
          kind load docker-image "$DYNAMIC_RP_REGISTRY/dynamic-rp:$DYNAMIC_RP_TAG" --name $CLUSTER_NAME

      - name: Preload alpine image into kind (avoid Docker Hub rate limits)
        run: |
          # The dynamic-rp Pod's terraform-init init container pulls
          # alpine:3.23 from Docker Hub, which is subject to anonymous
          # rate limits in CI (HTTP 429). Pull once on the runner and
          # side-load into the node so kubelet never hits docker.io.
          docker pull alpine:3.23
          kind load docker-image alpine:3.23 --name $CLUSTER_NAME

      - name: Install Radius CLI
        working-directory: radius
        run: |
          # Install the rad CLI built from the same submodule revision
          # so the CLI matches the chart we install below.
          make build-binaries
          sudo cp dist/linux_amd64/release/rad /usr/local/bin/rad
          rad version

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Install Radius from the worktree chart
        working-directory: radius
        run: |
          # psaMode=baseline in CI: PSA restricted requires kernel +
          # runc + containerd support for sysfs mounts inside user
          # namespaces, which the default kindest/node image does not
          # reliably provide on ubuntu-latest. Restricted mode remains
          # the design's target for production clusters; the chart
          # itself is exercised here in baseline mode.
          #
          # Note: as of radius main, `pkg/recipes/terraform/version.go`
          # pins the runtime download to a 1.14.x build, so the
          # previous `--set global.terraform.downloadUrl=...` workaround
          # for the TF 1.15 `terraform get` regression is no longer
          # required.
          rad install kubernetes \
            --reinstall \
            --chart deploy/Chart \
            --set dynamicrp.image=$DYNAMIC_RP_REGISTRY/dynamic-rp \
            --set dynamicrp.tag=$DYNAMIC_RP_TAG \
            --set dynamicrp.buildkit.psaMode=baseline

          kubectl wait --for=condition=available deployment --all -n radius-system --timeout=180s

          # Confirm the buildkitd sidecar came up.
          POD=$(kubectl get pods -n radius-system -l app.kubernetes.io/name=dynamic-rp -o jsonpath='{.items[0].metadata.name}')
          kubectl exec -n radius-system "$POD" -c buildkitd -- buildctl --addr tcp://127.0.0.1:1234 debug workers

      # ══════════════════════════════════════════════════════════════
      # PLATFORM ENGINEER — one-time environment setup
      #
      # The PE owns: cluster, Radius install, registry credentials,
      # resource type registration, and recipe registration. Developers
      # never touch any of these. Step names are prefixed `[PE]` to
      # make the persona boundary visible in the Actions UI.
      # ══════════════════════════════════════════════════════════════

      - name: '[PE] Create resource group, environment, and workspace'
        run: |
          rad group create default
          rad environment create default --group default
          rad workspace create kubernetes default \
            --context "$(kubectl config current-context)" \
            --environment default \
            --group default

      - name: '[PE] Provision registry credentials'
        run: |
          # Single dockerconfigjson Secret owned by the PE in
          # radius-system. The containerImages recipe is registered
          # below with --parameters registrySecretName=ghcr-creds, and
          # the recipe itself materializes a per-resource pull Secret
          # in each application namespace (so kubelet can pull) — no
          # developer ever sees these credentials. Use dry-run|apply
          # so the step is idempotent across repeated CI runs.
          kubectl create secret docker-registry ghcr-creds \
            --namespace radius-system \
            --docker-server=ghcr.io \
            --docker-username="${{ github.actor }}" \
            --docker-password="${{ secrets.GITHUB_TOKEN }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: '[PE] Register resource types'
        run: make register-types

      - name: '[PE] Build Bicep extensions'
        run: |
          # `make build` invokes `rad bicep publish-extension`, which
          # shells out to ~/.rad/bin/bicep. Ensure it's installed.
          rad bicep download
          make build

      - name: '[PE] Register Terraform recipes'
        run: |
          # containerImages — pin to this commit. Two PE-owned recipe
          # parameters: `registry` (where to push) and
          # `registrySecretName` (which radius-system Secret holds the
          # creds). Developers never see either.
          rad recipe register default \
            --resource-type Radius.Compute/containerImages \
            --template-kind terraform \
            --template-path "git::https://github.com/${{ github.repository }}.git//resource-types-contrib/Compute/containerImages/recipes/kubernetes/terraform?ref=${{ github.sha }}" \
            --parameters registry="${{ steps.registry.outputs.path }}" \
            --parameters registrySecretName="ghcr-creds"

          # containers — from resource-types-contrib (pinned to submodule commit)
          SUBMODULE_SHA=$(git -C resource-types-contrib rev-parse HEAD)
          rad recipe register default \
            --resource-type Radius.Compute/containers \
            --template-kind terraform \
            --template-path "git::https://github.com/radius-project/resource-types-contrib.git//Compute/containers/recipes/kubernetes/terraform?ref=${SUBMODULE_SHA}"

          # secrets — registered for completeness (developer might use
          # it for non-registry secrets); not required by the
          # containerImages flow under the PE-owned model.
          rad recipe register default \
            --resource-type Radius.Security/secrets \
            --template-kind terraform \
            --template-path "git::https://github.com/radius-project/resource-types-contrib.git//Security/secrets/recipes/kubernetes/terraform?ref=${SUBMODULE_SHA}"

      # ══════════════════════════════════════════════════════════════
      # DEVELOPER — every deploy
      #
      # Inputs are only what the developer naturally knows: where the
      # source lives and what tag to publish. NO registry credentials,
      # NO Secret names, NO extension declarations for `secrets`.
      # ══════════════════════════════════════════════════════════════

      - name: '[Developer] Deploy application'
        working-directory: demo
        run: |
          rad deploy app.bicep \
            -p imageTag="${IMAGE_TAG}" \
            -p buildContext="git::https://github.com/${{ github.repository }}.git//demo/app?ref=${IMAGE_TAG}"

      - name: '[Developer] Verify container is running'
        run: |
          NS=$(kubectl get namespaces -o name | grep default-demo | head -1 | cut -d/ -f2)
          kubectl wait --for=condition=available deployment/demo -n "$NS" --timeout=120s
          echo "✅ Container deployment is available"

      - name: '[Developer] Verify app responds'
        run: |
          NS=$(kubectl get namespaces -o name | grep default-demo | head -1 | cut -d/ -f2)
          kubectl port-forward -n "$NS" deployment/demo 3000:3000 &
          PF_PID=$!
          sleep 5
          RESPONSE=$(curl -sf http://localhost:3000)
          kill $PF_PID || true
          echo "Response: $RESPONSE"
          echo "$RESPONSE" | grep -q "Hello"
          echo "✅ App responded correctly"

      # ── Diagnostics & cleanup ────────────────────────────────────

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          echo "=== Pods ==="
          kubectl get pods --all-namespaces
          echo ""
          echo "=== radius-system pod descriptions ==="
          kubectl describe pods -n radius-system 2>/dev/null || true
          echo ""
          echo "=== terraform-init logs ==="
          kubectl logs -n radius-system -l app.kubernetes.io/name=dynamic-rp -c terraform-init --tail=200 2>/dev/null || true
          echo ""
          echo "=== dynamic-rp logs (recipe runner) ==="
          kubectl logs -n radius-system -l app.kubernetes.io/name=dynamic-rp -c dynamic-rp --tail=200 2>/dev/null || true
          echo ""
          echo "=== buildkitd sidecar logs ==="
          kubectl logs -n radius-system -l app.kubernetes.io/name=dynamic-rp -c buildkitd --tail=200 2>/dev/null || true
          echo ""
          NS=$(kubectl get namespaces -o name | grep default-demo | head -1 | cut -d/ -f2 || echo "unknown")
          if [ "$NS" != "unknown" ]; then
            echo "=== Pod logs in $NS ==="
            kubectl logs --all-containers --tail=50 -n "$NS" -l "radapp.io/resource" 2>/dev/null || true
            echo ""
            echo "=== Pod descriptions ==="
            kubectl describe pods -n "$NS" 2>/dev/null || true
          fi
          echo ""
          echo "=== Radius recipes ==="
          rad recipe list 2>/dev/null || true

      - name: Cleanup
        if: always()
        run: |
          rad application delete demo 2>/dev/null || true
          kind delete cluster --name $CLUSTER_NAME 2>/dev/null || true
