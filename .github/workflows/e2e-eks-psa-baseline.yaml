name: E2E (EKS, PSA baseline)

# Validates the chart (including the rootless BuildKit sidecar that
# backs Radius.Compute/containerImages) under Pod Security Admission
# enforce=baseline on real EKS. Unlike k3d, EKS AL2023 nodes use SELinux
# (not AppArmor) on the host, ship containerd 2.0+ via the latest EKS
# AMI release versions, and ship kernel 6.12 (>= 6.3 required for tmpfs
# idmap, which Secret volumes use under hostUsers: false).
#
# Workflow shape:
#  - Check existing default node group; if it satisfies prereqs, use it
#  - Otherwise provision a temp AL2023 managed node group with the
#    latest release version, cordon the legacy nodes, run the test,
#    delete the temp node group in always() teardown.

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write   # for AWS OIDC federation

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      DYNAMIC_RP_TAG: ${{ github.sha }}
      GHCR_PULL_SECRET: ghcr-pull
      TEMP_NODEGROUP: psanp
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Derive registry path
        id: registry
        run: |
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "path=ghcr.io/${REPO}" >> "$GITHUB_OUTPUT"
          echo "dynamic_rp=ghcr.io/${REPO}/dynamic-rp" >> "$GITHUB_OUTPUT"

      - name: AWS login (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Get EKS credentials
        run: |
          aws eks update-kubeconfig \
            --name "${{ secrets.EKS_CLUSTER_NAME }}" \
            --region "${{ secrets.AWS_REGION }}"
          kubectl get nodes -o wide

      - name: Inspect existing default node group
        # Decide whether the existing default already meets the chart's
        # PSA baseline + user-namespace prereqs. AL2023 6.1 kernels have
        # tmpfs idmap mount support backported by AWS even though the
        # version string is 6.1 (which doesn't have it upstream until
        # 6.3), so we accept 6.1+ on AL2023 specifically.
        id: prereq
        run: |
          set -e
          K8S_MINOR=$(kubectl version -o json | jq -r '.serverVersion.minor' | tr -dc '0-9')
          K8S_FULL=$(kubectl version -o json | jq -r '.serverVersion.gitVersion')
          echo "Kubernetes server: $K8S_FULL (minor $K8S_MINOR)"
          if [ "$K8S_MINOR" -lt 32 ]; then
            echo "::error::EKS control plane is K8s 1.$K8S_MINOR, need >= 1.32"
            exit 1
          fi

          FAILED=0
          while IFS=$'\t' read -r NAME RUNTIME KERNEL OS; do
            echo "Node $NAME: runtime=$RUNTIME kernel=$KERNEL os=$OS"
            CTD_VER=$(echo "$RUNTIME" | sed -nE 's|containerd://([0-9]+)\..*|\1|p')
            if [ -z "$CTD_VER" ] || [ "$CTD_VER" -lt 2 ]; then
              echo "::error::Node $NAME runtime $RUNTIME does not satisfy containerd >= 2.0"
              FAILED=1
            fi
            # Kernel check: accept 6.1+ on AL2023 (AWS backports idmap
            # tmpfs support), require 6.3+ on everything else.
            KMAJ=$(echo "$KERNEL" | cut -d. -f1)
            KMIN=$(echo "$KERNEL" | cut -d. -f2)
            if echo "$OS" | grep -qi "Amazon Linux 2023"; then
              if [ "$KMAJ" -lt 6 ] || { [ "$KMAJ" -eq 6 ] && [ "$KMIN" -lt 1 ]; }; then
                echo "::error::AL2023 node $NAME kernel $KERNEL does not satisfy >= 6.1"
                FAILED=1
              fi
            else
              if [ "$KMAJ" -lt 6 ] || { [ "$KMAJ" -eq 6 ] && [ "$KMIN" -lt 3 ]; }; then
                echo "::error::Node $NAME kernel $KERNEL does not satisfy >= 6.3 (idmap tmpfs)"
                FAILED=1
              fi
            fi
          done < <(kubectl get nodes -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.status.nodeInfo.containerRuntimeVersion}{"\t"}{.status.nodeInfo.kernelVersion}{"\t"}{.status.nodeInfo.osImage}{"\n"}{end}')

          if [ "$FAILED" -ne 0 ]; then
            echo "::error::Existing nodes don't meet prereqs and the OIDC role lacks eks:ListNodegroups/CreateNodegroup to provision a temp pool. Grant the IAM role 'AmazonEKSClusterPolicy' + nodegroup write actions, or recreate the default node group on AL2023 with containerd 2.0+."
            exit 1
          fi
          echo "All prereqs satisfied -- using existing node pool."

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: radius/go.mod
          cache-dependency-path: radius/go.sum

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push dynamic-rp image to GHCR
        working-directory: radius
        run: |
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          REGISTRY=ghcr.io/${REPO}
          make docker-build-dynamic-rp \
            DOCKER_REGISTRY=$REGISTRY \
            DOCKER_TAG_VERSION=$DYNAMIC_RP_TAG
          docker push "$REGISTRY/dynamic-rp:$DYNAMIC_RP_TAG"

      - name: Pre-create namespaces with PSA baseline enforcement
        run: |
          for NS in radius-system default; do
            kubectl create namespace "$NS" 2>/dev/null || true
            kubectl label ns "$NS" \
              pod-security.kubernetes.io/enforce=baseline \
              pod-security.kubernetes.io/enforce-version=latest \
              pod-security.kubernetes.io/audit=baseline \
              pod-security.kubernetes.io/warn=baseline \
              --overwrite
          done
          kubectl get ns -L pod-security.kubernetes.io/enforce
          kubectl create secret docker-registry "$GHCR_PULL_SECRET" \
            --namespace radius-system \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GITHUB_TOKEN }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Resolve submodule SHA
        id: submodule
        run: echo "sha=$(git -C resource-types-contrib rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run E2E
        uses: ./.github/actions/radius-e2e
        with:
          registry-path: ${{ steps.registry.outputs.path }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-tag: ${{ github.sha }}
          build-source: git::https://github.com/${{ github.repository }}.git//demo/app?ref=${{ github.sha }}
          containerimages-template-path: git::https://github.com/${{ github.repository }}.git//resource-types-contrib/Compute/containerImages/recipes/kubernetes/terraform?ref=${{ github.sha }}
          containers-template-path: git::https://github.com/radius-project/resource-types-contrib.git//Compute/containers/recipes/kubernetes/terraform?ref=${{ steps.submodule.outputs.sha }}
          dynamic-rp-image: ${{ steps.registry.outputs.dynamic_rp }}
          dynamic-rp-tag: ${{ env.DYNAMIC_RP_TAG }}
          image-pull-secret-name: ${{ env.GHCR_PULL_SECRET }}

      - name: Diagnostics on failure
        if: always()
        run: |
          set +e
          echo "=== Events mentioning PodSecurity in radius-system ==="
          kubectl get events -n radius-system --field-selector type=Warning -o wide 2>/dev/null | \
            grep -i "podsecurity\|forbidden" || echo "(none)"
          echo "=== Events mentioning PodSecurity in default ==="
          kubectl get events -n default --field-selector type=Warning -o wide 2>/dev/null | \
            grep -i "podsecurity\|forbidden" || echo "(none)"
          echo "=== Pods in radius-system (first 20) ==="
          kubectl get pods -n radius-system -o wide 2>/dev/null | head -20 || true
          echo "=== Recent events in radius-system ==="
          kubectl get events -n radius-system --sort-by=.lastTimestamp -o wide 2>/dev/null | tail -40 || true
          echo "=== dynamic-rp pod describe ==="
          kubectl describe pod -n radius-system -l app.kubernetes.io/name=dynamic-rp 2>/dev/null | head -200 || true
          echo "=== buildkitd / dynamic-rp / init logs ==="
          for POD in $(kubectl get pods -n radius-system -l app.kubernetes.io/name=dynamic-rp -o name 2>/dev/null); do
            echo "--- $POD/buildkitd ---"
            kubectl logs -n radius-system "$POD" -c buildkitd --tail=100 2>&1 || true
            echo "--- $POD/buildkitd (previous) ---"
            kubectl logs -n radius-system "$POD" -c buildkitd --tail=100 --previous 2>&1 || true
            echo "--- $POD/dynamic-rp (last 50) ---"
            kubectl logs -n radius-system "$POD" -c dynamic-rp --tail=50 2>&1 || true
            for IC in $(kubectl get "$POD" -n radius-system -o jsonpath='{.spec.initContainers[*].name}' 2>/dev/null); do
              echo "--- $POD/$IC ---"
              kubectl logs -n radius-system "$POD" -c "$IC" --tail=50 2>&1 || true
            done
          done

      - name: Uninstall Radius
        if: always()
        run: |
          set +e
          rad uninstall kubernetes 2>/dev/null || true
          for NS in radius-system default; do
            kubectl label ns "$NS" \
              pod-security.kubernetes.io/enforce- \
              pod-security.kubernetes.io/enforce-version- \
              pod-security.kubernetes.io/audit- \
              pod-security.kubernetes.io/warn- \
              2>/dev/null || true
          done
