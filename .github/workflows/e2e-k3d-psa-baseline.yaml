name: E2E (k3d, PSA baseline)

# Validates that the radius chart (including the rootless BuildKit
# sidecar that backs Radius.Compute/containerImages) deploys cleanly
# into a namespace under Pod Security Admission "baseline" enforcement,
# and that the demo app namespace also passes baseline. PSA is a
# built-in API-server admission plugin enabled by default since K8s
# 1.25 -- no install required, but it's a no-op unless the namespace
# is labeled, so the labels below are what actually opts us in.

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      CLUSTER_NAME: radius-e2e
      DYNAMIC_RP_REGISTRY: localhost
      DYNAMIC_RP_TAG: e2e
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Derive registry path
        id: registry
        run: |
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "path=ghcr.io/${REPO}" >> "$GITHUB_OUTPUT"

      - name: Install k3d
        run: |
          curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash
          k3d version

      - name: Loosen host sysctls and disable docker-default AppArmor
        # Ubuntu 24.04+ (which GHA ubuntu-latest is based on) defaults
        # kernel.apparmor_restrict_unprivileged_userns=1 AND ships a
        # docker-default AppArmor profile that's auto-applied to every
        # Docker container. Both of these block the rootless BuildKit
        # sidecar from creating its nested user namespace when running
        # inside the k3d node container:
        #   [rootlesskit:parent] error: failed to start the child:
        #   fork/exec /proc/self/exe: operation not permitted
        #
        # 1. Loosen the kernel sysctl. Documented in
        #    https://github.com/moby/buildkit/blob/master/docs/rootless.md
        # 2. Unload the docker-default AppArmor profile so the k3d
        #    container can create user namespaces inside itself. This
        #    is k3d/kind-specific. Real-cluster nodes (AKS Azure Linux 3,
        #    EKS AL2023) use SELinux not AppArmor on the host and don't
        #    have this problem.
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo sysctl -w user.max_user_namespaces=63359
          if [ -f /etc/apparmor.d/docker ]; then
            sudo apparmor_parser -R /etc/apparmor.d/docker || true
          fi
          echo "AppArmor profiles after:"
          sudo aa-status --enabled 2>&1 || true
          sudo aa-status 2>&1 | grep -i docker || echo "(no docker profile loaded)"

      - name: Create k3d cluster
        # K3s v1.34+ embeds containerd 2.x which is required for
        # UserNamespacesSupport (the dynamic-rp Pod sets hostUsers: false
        # so rootless BuildKit can satisfy PSA baseline). Pin explicitly
        # so this doesn't silently break if k3d's default image drifts
        # backwards.
        run: |
          k3d cluster create $CLUSTER_NAME \
            --image rancher/k3s:v1.34.1-k3s1 \
            --wait --timeout 180s
          kubectl wait --for=condition=ready node --all --timeout=120s
          kubectl version
          kubectl get nodes -o jsonpath='{.items[*].status.nodeInfo.containerRuntimeVersion}{"\n"}'

      - name: Pre-create namespaces with PSA baseline enforcement
        # Pre-create radius-system AND the default namespace (which is
        # where the demo Radius app deploys its containers) so we can
        # apply the PSA enforce=baseline label before any workloads land.
        # rad install / Radius app deploy is otherwise a no-op on the
        # namespace if it already exists.
        run: |
          kubectl create namespace radius-system 2>/dev/null || true
          for NS in radius-system default; do
            kubectl label ns "$NS" \
              pod-security.kubernetes.io/enforce=baseline \
              pod-security.kubernetes.io/enforce-version=latest \
              pod-security.kubernetes.io/audit=baseline \
              pod-security.kubernetes.io/warn=baseline \
              --overwrite
          done
          kubectl get ns -L pod-security.kubernetes.io/enforce

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: radius/go.mod
          cache-dependency-path: radius/go.sum

      - name: Build dynamic-rp image
        working-directory: radius
        run: |
          make docker-build-dynamic-rp \
            DOCKER_REGISTRY=$DYNAMIC_RP_REGISTRY \
            DOCKER_TAG_VERSION=$DYNAMIC_RP_TAG

      - name: Side-load images into k3d
        run: |
          k3d image import "$DYNAMIC_RP_REGISTRY/dynamic-rp:$DYNAMIC_RP_TAG" -c $CLUSTER_NAME
          docker pull alpine:3.23
          k3d image import alpine:3.23 -c $CLUSTER_NAME

      - name: Resolve submodule SHA
        id: submodule
        run: echo "sha=$(git -C resource-types-contrib rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run E2E
        uses: ./.github/actions/radius-e2e
        with:
          registry-path: ${{ steps.registry.outputs.path }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-tag: ${{ github.sha }}
          build-source: git::https://github.com/${{ github.repository }}.git//demo/app?ref=${{ github.sha }}
          containerimages-template-path: git::https://github.com/${{ github.repository }}.git//resource-types-contrib/Compute/containerImages/recipes/kubernetes/terraform?ref=${{ github.sha }}
          containers-template-path: git::https://github.com/radius-project/resource-types-contrib.git//Compute/containers/recipes/kubernetes/terraform?ref=${{ steps.submodule.outputs.sha }}
          dynamic-rp-image: ${{ env.DYNAMIC_RP_REGISTRY }}/dynamic-rp
          dynamic-rp-tag: ${{ env.DYNAMIC_RP_TAG }}

      - name: Verify no PSA violations were emitted
        # Failures show up as Warning events with reason "FailedCreate"
        # or as pods stuck Pending with status "forbidden: violates
        # PodSecurity". Surface both for easy debugging, plus dump pod
        # state and container logs so non-PSA failures (e.g. buildkitd
        # failing to start under user namespaces) are also diagnosable.
        if: always()
        run: |
          set +e
          echo "=== Events mentioning PodSecurity in radius-system ==="
          kubectl get events -n radius-system \
            --field-selector type=Warning -o wide 2>/dev/null | \
            grep -i "podsecurity\|forbidden" || echo "(none)"
          echo "=== Events mentioning PodSecurity in default ==="
          kubectl get events -n default \
            --field-selector type=Warning -o wide 2>/dev/null | \
            grep -i "podsecurity\|forbidden" || echo "(none)"
          echo "=== Node info ==="
          kubectl get nodes -o json 2>/dev/null | \
            jq -r '.items[] | {name: .metadata.name, kernel: .status.nodeInfo.kernelVersion, os: .status.nodeInfo.osImage, runtime: .status.nodeInfo.containerRuntimeVersion}' || true
          echo "=== Pods in radius-system ==="
          # Truncate noisy ReplicaSet thrash (a stuck dynamic-rp deployment
          # will spawn hundreds of pods over 5 min); just sample.
          kubectl get pods -n radius-system -o wide 2>/dev/null | head -20 || true
          echo "=== Pod events in radius-system (recent) ==="
          kubectl get events -n radius-system --sort-by=.lastTimestamp -o wide 2>/dev/null | tail -40 || true
          echo "=== dynamic-rp pod describe ==="
          kubectl describe pod -n radius-system -l app.kubernetes.io/name=dynamic-rp 2>/dev/null || true
          echo "=== buildkitd container logs (last 100 lines) ==="
          for POD in $(kubectl get pods -n radius-system -l app.kubernetes.io/name=dynamic-rp -o name 2>/dev/null); do
            echo "--- $POD/buildkitd ---"
            kubectl logs -n radius-system "$POD" -c buildkitd --tail=100 2>&1 || true
            echo "--- $POD/buildkitd (previous) ---"
            kubectl logs -n radius-system "$POD" -c buildkitd --tail=100 --previous 2>&1 || true
            echo "--- $POD/dynamic-rp (last 50 lines) ---"
            kubectl logs -n radius-system "$POD" -c dynamic-rp --tail=50 2>&1 || true
          done
          echo "=== Init container logs ==="
          for POD in $(kubectl get pods -n radius-system -l app.kubernetes.io/name=dynamic-rp -o name 2>/dev/null); do
            for IC in $(kubectl get "$POD" -n radius-system -o jsonpath='{.spec.initContainers[*].name}' 2>/dev/null); do
              echo "--- $POD/$IC ---"
              kubectl logs -n radius-system "$POD" -c "$IC" --tail=50 2>&1 || true
            done
          done

      - name: Cleanup cluster
        if: always()
        run: k3d cluster delete $CLUSTER_NAME 2>/dev/null || true
