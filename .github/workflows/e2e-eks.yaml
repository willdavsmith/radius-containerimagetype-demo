name: E2E (EKS)

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write   # for AWS OIDC federation

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      DYNAMIC_RP_TAG: ${{ github.sha }}
      GHCR_PULL_SECRET: ghcr-pull
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Derive registry path
        id: registry
        run: |
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "path=ghcr.io/${REPO}" >> "$GITHUB_OUTPUT"
          echo "dynamic_rp=ghcr.io/${REPO}/dynamic-rp" >> "$GITHUB_OUTPUT"

      - name: AWS login (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Get EKS credentials
        run: |
          aws eks update-kubeconfig \
            --name "${{ secrets.EKS_CLUSTER_NAME }}" \
            --region "${{ secrets.AWS_REGION }}"
          kubectl get nodes

      - name: Clean stale Radius state from prior runs
        # EKS is a long-lived shared cluster. Prior runs leave stale
        # pods/replicasets in radius-system + leftover demo apps in
        # default. A new helm install can deadlock waiting for the
        # old dynamic-rp ReplicaSet to roll, so wipe wholesale.
        #
        # radius-system has CRD finalizers that block namespace
        # termination once their controller is gone (which happens
        # mid-uninstall). Force-strip finalizers if the namespace
        # is still Terminating after 60s.
        run: |
          set +e
          rad uninstall kubernetes 2>/dev/null || true
          kubectl delete ns radius-system --wait=false --ignore-not-found 2>/dev/null || true
          kubectl delete deployment,statefulset,daemonset,svc,httproute -n default \
            -l radapp.io/application --ignore-not-found 2>/dev/null || true

          # Wait up to 60s for graceful termination first.
          for i in $(seq 1 12); do
            kubectl get ns radius-system 2>/dev/null || break
            sleep 5
          done

          # Force-finalize if still stuck.
          if kubectl get ns radius-system 2>/dev/null; then
            echo "radius-system stuck Terminating; force-stripping finalizers..."
            kubectl get ns radius-system -o json \
              | jq '.spec.finalizers=[] | .metadata.finalizers=[]' \
              | kubectl replace --raw "/api/v1/namespaces/radius-system/finalize" -f -
            # Find any remaining resources with finalizers in the ns
            # and strip those too.
            for kind in $(kubectl api-resources --verbs=list --namespaced -o name); do
              kubectl get "$kind" -n radius-system -o name 2>/dev/null | while read res; do
                kubectl patch "$res" -n radius-system --type=merge -p '{"metadata":{"finalizers":[]}}' 2>/dev/null || true
              done
            done
            # Wait again for the unstuck namespace to disappear.
            for i in $(seq 1 12); do
              kubectl get ns radius-system 2>/dev/null || break
              sleep 5
            done
          fi
          kubectl get ns radius-system 2>/dev/null && echo "still stuck after force-strip" || echo "namespace cleared"
          set -e

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: radius/go.mod
          cache-dependency-path: radius/go.sum

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push dynamic-rp image to GHCR
        working-directory: radius
        run: |
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          REGISTRY=ghcr.io/${REPO}
          make docker-build-dynamic-rp \
            DOCKER_REGISTRY=$REGISTRY \
            DOCKER_TAG_VERSION=$DYNAMIC_RP_TAG
          docker push "$REGISTRY/dynamic-rp:$DYNAMIC_RP_TAG"

      - name: Create radius-system namespace and GHCR pull secret
        run: |
          kubectl create namespace radius-system 2>/dev/null || true
          kubectl create secret docker-registry "$GHCR_PULL_SECRET" \
            --namespace radius-system \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GITHUB_TOKEN }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Resolve submodule SHA
        id: submodule
        run: echo "sha=$(git -C resource-types-contrib rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run E2E
        uses: ./.github/actions/radius-e2e
        with:
          registry-path: ${{ steps.registry.outputs.path }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-tag: ${{ github.sha }}
          build-source: git::https://github.com/${{ github.repository }}.git//demo/app?ref=${{ github.sha }}
          containerimages-template-path: git::https://github.com/${{ github.repository }}.git//resource-types-contrib/Compute/containerImages/recipes/kubernetes/terraform?ref=${{ github.sha }}
          containers-template-path: git::https://github.com/${{ github.repository }}.git//resource-types-contrib/Compute/containers/recipes/kubernetes/terraform?ref=${{ github.sha }}
          dynamic-rp-image: ${{ steps.registry.outputs.dynamic_rp }}
          dynamic-rp-tag: ${{ env.DYNAMIC_RP_TAG }}
          image-pull-secret-name: ${{ env.GHCR_PULL_SECRET }}

      - name: Uninstall Radius
        if: always()
        run: rad uninstall kubernetes 2>/dev/null || true
